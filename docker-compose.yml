# Affiliate HQ on a VPS:  docker compose up -d --build
# Services: db (PostgreSQL, data kept in a Docker volume) · app (the screens) · worker (TikTok/Ads/Shopee syncs, same image) · caddy (HTTPS, automatic certificates)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Tuned for a small VPS (2–4 GB memory) running reports: more cache and sort memory than the factory settings, and no JIT
    # (compiling short report queries costs more than it saves). Raise shared_buffers/effective_cache_size on a bigger server.
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c jit=off
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=60
    environment:
      POSTGRES_USER: affiliate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: affiliate
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiliate -d affiliate"]
      interval: 5s
      timeout: 5s
      retries: 12
    # not published to the internet: only the app can reach it

  app:
    build: .
    image: affiliate-hq:latest
    restart: unless-stopped
    volumes:
      # read-only: lets Settings → Storage list the backups made by scripts/backup.sh
      - ./backups:/app/backups:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://affiliate:${POSTGRES_PASSWORD}@db:5432/affiliate
      NODE_ENV: production
      # The screens only. The syncs run in the "worker" service below, so they never slow a page down.
      APP_ROLE: web
      # Keep "true" when you use a domain with HTTPS. Use "false" only for a short plain-http test by IP address.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # TikTok Shop connection (optional). Put the real values in the private .env file, never in git.
      TIKTOK_APP_KEY: ${TIKTOK_APP_KEY:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
      TIKTOK_SERVICE_ID: ${TIKTOK_SERVICE_ID:-}
      TIKTOK_AUTH_URL: ${TIKTOK_AUTH_URL:-}
      # TikTok Ads / GMV Max connection (optional; a separate app from TikTok Shop).
      TIKTOK_ADS_APP_ID: ${TIKTOK_ADS_APP_ID:-}
      TIKTOK_ADS_APP_SECRET: ${TIKTOK_ADS_APP_SECRET:-}
      TIKTOK_ADS_REDIRECT_URI: ${TIKTOK_ADS_REDIRECT_URI:-}
      # Shopee Open Platform (optional). SHOPEE_ENV is "sandbox" while the app is Developing, "live" after Shopee approves it.
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      SHOPEE_ENV: ${SHOPEE_ENV:-sandbox}

  # The same app, started as the background worker: TikTok Shop, TikTok Ads and Shopee syncs on their schedules, and preparing
  # the data for the screens after each sync. Not reachable from outside. It waits until "app" is healthy (migrations done).
  worker:
    image: affiliate-hq:latest
    restart: unless-stopped
    command: ["node", "server.js"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://affiliate:${POSTGRES_PASSWORD}@db:5432/affiliate
      NODE_ENV: production
      APP_ROLE: worker
      TIKTOK_APP_KEY: ${TIKTOK_APP_KEY:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
      TIKTOK_SERVICE_ID: ${TIKTOK_SERVICE_ID:-}
      TIKTOK_AUTH_URL: ${TIKTOK_AUTH_URL:-}
      TIKTOK_ADS_APP_ID: ${TIKTOK_ADS_APP_ID:-}
      TIKTOK_ADS_APP_SECRET: ${TIKTOK_ADS_APP_SECRET:-}
      TIKTOK_ADS_REDIRECT_URI: ${TIKTOK_ADS_REDIRECT_URI:-}
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      SHOPEE_ENV: ${SHOPEE_ENV:-sandbox}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (for example affiliates.example.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  dbdata:
  caddydata:
  caddyconfig:
